<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>EasyMeet - Interface Web</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="toast">Erro ao processar requisição</div>

  <main>
    <h1>EasyMeet</h1>
    <p>Interface web para resumo de reuniões via IA.</p>
    
    <label for="texto">Texto da reunião</label>
    <textarea id="texto" rows="8" placeholder="Cole aqui a transcrição da reunião..."></textarea>
    
    <button id="enviar">Resumir Reunião</button>
    
    <div id="resultado" class="result-section">
      <div class="result-field">
        <label>Tipo de Reunião</label>
        <input type="text" id="tipoReuniao" readonly />
      </div>

      <div class="result-field">
        <label>Nível de Confiança</label>
        <input type="text" id="nivelConfianca" readonly />
      </div>

      <div class="result-field">
        <label>Tópicos Principais</label>
        <textarea id="topicos" rows="3" readonly></textarea>
      </div>

      <div class="result-field">
        <label>Ações Identificadas</label>
        <textarea id="acoes" rows="3" readonly></textarea>
      </div>

      <div class="result-field">
        <label>Responsáveis</label>
        <textarea id="responsaveis" rows="2" readonly></textarea>
      </div>

      <div class="result-field">
        <label>Resumo Final</label>
        <textarea id="saida" rows="6" readonly></textarea>
      </div>
    </div>
  </main>

  <script src="js/script.js"></script>
</body>
</html>
