name: .NET CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test (.NET 9)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore dependencies
        run: dotnet restore EasyMeet.sln

      - name: Build
        run: dotnet build EasyMeet.sln --configuration Release --no-restore

      - name: Test EasyMeet.Tests
        run: dotnet test tests/EasyMeet.Tests/EasyMeet.Tests.csproj --configuration Release --no-build --verbosity normal /p:CollectCoverage=true /p:CoverletOutputFormat=opencover /p:Threshold=30 /p:ThresholdType=line /p:FailOnThreshold=true
